#:schema node_modules/wrangler/config-schema.json
# AXS Diagnostic Lab API — Cloudflare Workers Free + D1 Free target.
# Limits referenced in PROJECT.md §6; re-check before deployment.

name = "axs-diagnostic-lab-api-dev"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret configuration. Secrets (e.g. token signing keys, added in
# Sprint 4) go in .dev.vars locally and `wrangler secret put` remotely —
# never in this file or in source control.
[vars]
ENVIRONMENT = "development"

# Local development database. `wrangler dev` and `--local` migrations use a
# SQLite file under .wrangler/, so this placeholder id is fine locally.
[[d1_databases]]
binding = "DB"
database_name = "axs-diagnostic-lab-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Production: Cloudflare account geza.mahardika@gmail.com, D1 "diagtool".
# ---------------------------------------------------------------------------
[env.production]
name = "axs-diagnostic-lab-api"
account_id = "d32488e03e96474031a2f9e292ecfafb"

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "diagtool"
database_id = "771265c3-669c-4100-8bd9-eb625ee7a8eb"
migrations_dir = "migrations"
